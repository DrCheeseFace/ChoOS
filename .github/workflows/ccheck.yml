name: fmt check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format-check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: find -iname "*.c" -o -iname "*.h" | xargs clang-format --verbose --dry-run --Werror
